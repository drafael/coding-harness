name: Autopilot Windows Job Object helper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Reproducible MSVC x64 helper and real Job Object tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: skills/autopilot/runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: skills/autopilot/runtime/package-lock.json
      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name "Autopilot CI"
          git config user.email "autopilot-ci@example.invalid"
      - name: Build helper twice and compare SHA-256
        shell: pwsh
        run: |
          $env:AUTOPILOT_WORKFLOW_SHA = (git hash-object ../../../.github/workflows/autopilot-windows-helper.yml).Trim()
          ./scripts/build-windows-helper.ps1
      - name: Install reproducible helper for package validation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native/bin/win32-x64 | Out-Null
          Copy-Item native/build/windows-job-helper/artifact/job-helper.exe native/bin/win32-x64/job-helper.exe
          Copy-Item native/build/windows-job-helper/artifact/job-helper.json native/bin/win32-x64/job-helper.json
      - name: Install development dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Run real Windows Job Object suite
        run: npm test
      - name: Verify packaged helper identity
        shell: pwsh
        run: |
          $source = (Get-FileHash -Algorithm SHA256 native/bin/win32-x64/job-helper.exe).Hash
          $packaged = (Get-FileHash -Algorithm SHA256 dist/native/win32-x64/job-helper.exe).Hash
          if ($source -ne $packaged) { throw "packaged helper digest changed" }
          $manifest = Get-Content dist/native/win32-x64/job-helper.json | ConvertFrom-Json
          if ($manifest.sha256 -ne $source.ToLowerInvariant()) { throw "packaged helper manifest changed" }
          if ($manifest.provenance -ne "github-actions-workflow-dispatch") { throw "helper provenance is not trusted" }
          if ($manifest.sourceCommit -ne "${{ github.sha }}") { throw "helper source commit provenance changed" }
          $sourceSha = (Get-FileHash -Algorithm SHA256 native/windows-job-helper.c).Hash.ToLowerInvariant()
          if ($manifest.sourceSha256 -ne $sourceSha) { throw "helper source digest provenance changed" }
          $workflowSha = (git hash-object ../../../.github/workflows/autopilot-windows-helper.yml).Trim()
          if ($manifest.workflowSha -ne $workflowSha) { throw "helper workflow SHA provenance changed" }
          if ($manifest.workflowRunId -ne "${{ github.run_id }}") { throw "helper workflow run provenance changed" }
          if ($manifest.workflowRunAttempt -ne "${{ github.run_attempt }}") { throw "helper workflow attempt provenance changed" }
          if ($manifest.workflowEvent -ne "workflow_dispatch") { throw "helper workflow event provenance changed" }
          if ($manifest.repository -ne "${{ github.repository }}") { throw "helper repository provenance changed" }
          if ($manifest.workflowName -ne "${{ github.workflow }}") { throw "helper workflow name provenance changed" }
          if ($manifest.workflowRef -ne "${{ github.workflow_ref }}") { throw "helper workflow ref provenance changed" }
          if (-not $manifest.toolset) { throw "helper toolset provenance is absent" }
      - name: Upload reviewed bootstrap artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: autopilot-job-helper-win32-x64-${{ github.sha }}
          path: skills/autopilot/runtime/native/build/windows-job-helper/artifact/
          if-no-files-found: error
          retention-days: 7
